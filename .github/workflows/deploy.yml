name: Deploy Aura RIFAT Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Grant GitHub Pages deployment permissions
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments while ensuring active deployments complete
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Inspect and ensure folder structure
        run: |
          echo "=== Repository root files ==="
          ls -la

          # On mobile devices, file uploads sometimes flatten into root directory.
          # Automatically restore required folder structure if misplaced:
          mkdir -p src
          for file in main.tsx App.tsx index.css; do
            if [ -f "$file" ] && [ ! -f "src/$file" ]; then
              echo "Moving $file into src/"
              mv "$file" "src/"
            fi
          done

          for dir in components context utils; do
            if [ -d "$dir" ] && [ ! -d "src/$dir" ]; then
              echo "Moving $dir directory into src/"
              mv "$dir" "src/"
            fi
          done

          if [ -d "src" ]; then
            echo "=== Contents of src/ ==="
            ls -la src
          fi

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build production site with Vite
        run: |
          if [ -f "src/main.tsx" ]; then
            npm run build
          elif [ -f "dist/index.html" ]; then
            echo "Using pre-built dist output directory."
          else
            echo "::error::Neither src/main.tsx nor dist/index.html was found in this repository."
            echo "Please make sure your files are uploaded to GitHub."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
